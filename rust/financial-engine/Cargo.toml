[package]
name = "financial-engine"
version = "0.1.0"
edition = "2021"
description = "High-level financial orchestration engine coordinating ledger, fee, and settlement engines."
license = "PROPRIETARY"
authors = ["Kudi AI Bank Engineering <engineering@kudiaibank.com>"]

[lib]
name = "financial_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
