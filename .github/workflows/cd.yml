name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mobile-api, web-api, admin-api, api-gateway]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kudi-ai-bank-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kudi-ai-bank-${{ matrix.service }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
      - name: Apply manifests
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl apply -f deployment/kubernetes/base/
          kubectl apply -f deployment/kubernetes/mobile-api/
          kubectl apply -f deployment/kubernetes/web-api/
          kubectl apply -f deployment/kubernetes/admin-api/
          kubectl apply -f deployment/kubernetes/api-gateway/
          kubectl rollout status deployment/mobile-api -n kudi-ai-bank
          kubectl rollout status deployment/web-api -n kudi-ai-bank
          kubectl rollout status deployment/admin-api -n kudi-ai-bank
          kubectl rollout status deployment/api-gateway -n kudi-ai-bank
